<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="70%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3d5a" />
      <stop offset="100%" stop-color="#d50000" />
    </linearGradient>
  </defs>

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#1f2940" stroke-width="4" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="12 10" opacity="0.6" filter="url(#glowCyan)" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ff1744" stroke-width="1.5" opacity="0.4" />

  <!-- Spider-Man Emblem -->
  <g id="spider" filter="url(#glowRed)" fill="url(#redGrad)" stroke="#ff616f" stroke-width="1.5">
    <!-- Head and Fangs -->
    <path d="M256,155 L268,185 L260,205 L252,205 L244,185 Z" />
    <path d="M252,150 L256,138 L260,150 L256,156 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Thorax and Abdomen -->
    <path d="M256,205 L272,235 L266,285 L256,335 L246,285 L240,235 Z" />
    
    <!-- Upper Left Leg 1 -->
    <path d="M248,212 Q200,165 145,130 Q140,126 150,118 Q195,145 245,200 Z" />
    <!-- Upper Left Leg 2 -->
    <path d="M244,226 Q180,200 115,195 Q108,195 112,185 Q175,188 242,216 Z" />
    <!-- Lower Left Leg 1 -->
    <path d="M245,248 Q170,270 120,330 Q115,336 122,342 Q170,290 244,258 Z" />
    <!-- Lower Left Leg 2 -->
    <path d="M248,270 Q185,320 150,405 Q145,416 155,420 Q190,345 250,285 Z" />

    <!-- Upper Right Leg 1 -->
    <path d="M264,212 Q312,165 367,130 Q372,126 362,118 Q317,145 267,200 Z" />
    <!-- Upper Right Leg 2 -->
    <path d="M268,226 Q332,200 397,195 Q404,195 400,185 Q337,188 270,216 Z" />
    <!-- Lower Right Leg 1 -->
    <path d="M267,248 Q342,270 392,330 Q397,336 390,342 Q342,290 268,258 Z" />
    <!-- Lower Right Leg 2 -->
    <path d="M264,270 Q327,320 362,405 Q367,416 357,420 Q322,345 262,285 Z" />
  </g>

  <!-- Center Core Wave Accent -->
  <line x1="216" y1="256" x2="296" y2="256" stroke="#00e5ff" stroke-width="2" opacity="0.8" filter="url(#glowCyan)" />
  <circle cx="256" cy="256" r="4" fill="#ffffff" />
</svg>
