<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Spider Emblem 3D Experience</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols_Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#dc2626", // Heroic Crimson Red
            "background-light": "#f1f5f9",
            "background-dark": "#07090e",
            cyanGlow: "#38bdf8",
            electricBlue: "#0284c7"
          },
          fontFamily: {
            display: ["Rajdhani", "sans-serif"],
            sans: ["Plus Jakarta Sans", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "1rem",
          },
        },
      },
    };
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>body {
      touch-action: none;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 20px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }.glow-primary {
      filter: drop-shadow(0 0 16px rgba(220, 38, 38, 0.45));
    }
    .glow-cyan {
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.5));
    }
    .backdrop-blur-glass {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 font-sans min-h-screen overflow-hidden flex flex-col justify-between selection:bg-primary selection:text-white">
<div class="absolute inset-0 z-0" id="canvas-container"></div>
<div class="pointer-events-none absolute inset-0 z-0 bg-radial from-transparent via-transparent to-black/70 opacity-80"></div>
<div class="pointer-events-none absolute inset-0 z-0 opacity-15 dark:opacity-25 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:24px_24px]"></div>
<header class="relative z-10 w-full px-5 pt-3 safe-top flex items-center justify-between pointer-events-auto">
<button aria-label="Toggle Theme" class="w-10 h-10 rounded-full flex items-center justify-center bg-white/70 dark:bg-slate-900/70 border border-slate-200/50 dark:border-slate-800/80 shadow-md text-slate-700 dark:text-slate-200 backdrop-blur-glass active:scale-95 transition-all" id="theme-toggle">
<span class="material-symbols-outlined text-[20px]" id="theme-icon">dark_mode</span>
</button>
<div class="flex flex-col items-center">
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
<span class="font-display tracking-[0.25em] text-xs uppercase font-bold text-slate-500 dark:text-slate-400">Symbiote Core</span>
</div>
<h1 class="font-display font-extrabold text-xl tracking-wider text-slate-900 dark:text-white flex items-center gap-1">
        ARACHNID <span class="text-primary font-bold">MK-II</span>
</h1>
</div>
<button aria-label="Recenter Model" class="w-10 h-10 rounded-full flex items-center justify-center bg-white/70 dark:bg-slate-900/70 border border-slate-200/50 dark:border-slate-800/80 shadow-md text-slate-700 dark:text-slate-200 backdrop-blur-glass active:scale-95 transition-all" id="reset-cam">
<span class="material-symbols-outlined text-[20px]">view_in_ar</span>
</button>
</header>
<aside class="relative z-10 px-5 pointer-events-none flex flex-col gap-2.5 self-start mt-2">
<div class="pointer-events-auto inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/60 dark:bg-black/50 border border-white/10 backdrop-blur-glass text-xs font-medium text-slate-200 shadow-lg">
<span class="material-symbols-outlined text-sm text-cyanGlow">touch_app</span>
<span>Drag to orbit • Pinch to zoom</span>
</div>
<div class="pointer-events-auto inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/60 dark:bg-black/50 border border-white/10 backdrop-blur-glass text-xs font-mono text-slate-300">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
<span id="fps-counter">60 FPS</span>
<span class="text-slate-500">|</span>
<span id="poly-count">8.4k Verts</span>
</div>
</aside>
<main class="relative z-10 w-full px-4 safe-bottom pointer-events-auto flex flex-col items-center">
<div class="w-full max-w-md bg-white/80 dark:bg-slate-900/85 backdrop-blur-glass border border-slate-200/70 dark:border-slate-800/80 rounded-3xl p-4 shadow-2xl transition-all mb-2">
<div class="w-10 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-3"></div>
<div class="mb-3">
<label class="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 flex justify-between items-center">
<span>Nano-Suit Shading</span>
<span class="text-primary font-semibold" id="current-finish-name">Insomniac White</span>
</label>
<div class="grid grid-cols-4 gap-2">
<button class="finish-btn active relative flex flex-col items-center justify-center py-2 px-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800/90 text-slate-900 dark:text-white transition-all" data-finish="white">
<span class="w-4 h-4 rounded-full bg-slate-100 border-2 border-white shadow mb-1"></span>
<span class="text-[10px] font-semibold">White</span>
</button>
<button class="finish-btn relative flex flex-col items-center justify-center py-2 px-1 rounded-xl border border-slate-200/60 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-slate-700 dark:text-slate-300 transition-all" data-finish="stealth">
<span class="w-4 h-4 rounded-full bg-zinc-900 border border-slate-700 mb-1"></span>
<span class="text-[10px] font-semibold">Stealth</span>
</button>
<button class="finish-btn relative flex flex-col items-center justify-center py-2 px-1 rounded-xl border border-slate-200/60 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-slate-700 dark:text-slate-300 transition-all" data-finish="chrome">
<span class="w-4 h-4 rounded-full bg-gradient-to-tr from-slate-400 to-white border border-slate-300 mb-1"></span>
<span class="text-[10px] font-semibold">Titanium</span>
</button>
<button class="finish-btn relative flex flex-col items-center justify-center py-2 px-1 rounded-xl border border-slate-200/60 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 text-slate-700 dark:text-slate-300 transition-all" data-finish="crimson">
<span class="w-4 h-4 rounded-full bg-red-600 border border-red-400 mb-1 shadow-red-500/40 shadow-sm"></span>
<span class="text-[10px] font-semibold">Velocity</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 pt-1 border-t border-slate-200/60 dark:border-slate-800">
<button class="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200/80 dark:border-slate-700/60 text-xs font-semibold text-slate-800 dark:text-slate-200 transition-all" id="toggle-spin">
<span class="material-symbols-outlined text-base text-primary">sync</span>
<span id="spin-text">Auto Rotate</span>
</button>
<button class="flex-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200/80 dark:border-slate-700/60 text-xs font-semibold text-slate-800 dark:text-slate-200 transition-all" id="toggle-pulse">
<span class="material-symbols-outlined text-base text-cyanGlow">flare</span>
<span>Kinetic Core</span>
</button>
<button class="w-11 h-11 flex items-center justify-center rounded-xl bg-primary text-white shadow-lg shadow-red-600/30 active:scale-95 transition-all" id="btn-pulse-wave">
<span class="material-symbols-outlined text-xl">electric_bolt</span>
</button>
</div>
</div>
</main>
<script>
    // --- Dark Mode Switcher ---
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const htmlEl = document.documentElement;
    themeToggle.addEventListener('click', () => {
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        themeIcon.textContent = 'light_mode';
        updateSceneTheme(false);
      } else {
        htmlEl.classList.add('dark');
        themeIcon.textContent = 'dark_mode';
        updateSceneTheme(true);
      }
    });
    // --- THREE.JS IMPLEMENTATION ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    // Camera Setup (Mobile Portrait optimized)
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 16);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxDistance = 25;
    controls.minDistance = 6;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;
    // --- LIGHTING RIG (Cinematic studio suit illumination) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(5, 8, 10);
    keyLight.castShadow = true;
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x38bdf8, 2.8); // Cyber blue edge rim
    rimLight.position.set(-8, 4, -8);
    scene.add(rimLight);
    const bottomGlow = new THREE.PointLight(0xdc2626, 2.0, 20); // Hero red underglow
    bottomGlow.position.set(0, -6, 2);
    scene.add(bottomGlow);
    const dynamicCenterLight = new THREE.PointLight(0xffffff, 0.5, 8);
    scene.add(dynamicCenterLight);
    function updateSceneTheme(isDark) {
      if (isDark) {
        scene.background = null;
        ambientLight.intensity = 0.6;
        keyLight.intensity = 2.2;
        rimLight.color.setHex(0x38bdf8);
      } else {
        scene.background = null;
        ambientLight.intensity = 1.1;
        keyLight.intensity = 2.0;
        rimLight.color.setHex(0x60a5fa);
      }
    }
    // --- PROCEDURAL 3D ADVANCED SPIDER EMBLEM GEOMETRY ---
    // Faithfully matches the Marvel's Spider-Man white chest insignia from user reference
    const emblemGroup = new THREE.Group();
    scene.add(emblemGroup);
    // Materials Library
    const materials = {
      white: new THREE.MeshPhysicalMaterial({
        color: 0xeeeff3,
        metalness: 0.15,
        roughness: 0.22,
        clearcoat: 0.8,
        clearcoatRoughness: 0.15,
        reflectivity: 0.9,
      }),
      stealth: new THREE.MeshPhysicalMaterial({
        color: 0x111317,
        metalness: 0.85,
        roughness: 0.35,
        clearcoat: 0.4,
        clearcoatRoughness: 0.2,
      }),
      chrome: new THREE.MeshPhysicalMaterial({
        color: 0xd8e0eb,
        metalness: 0.95,
        roughness: 0.12,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
      }),
      crimson: new THREE.MeshPhysicalMaterial({
        color: 0xd91616,
        metalness: 0.4,
        roughness: 0.25,
        clearcoat: 0.9,
        clearcoatRoughness: 0.1,
        emissive: 0x3d0000,
      })
    };
    let currentMaterial = materials.white;
    const extrudeSettings = {
      depth: 0.42,
      bevelEnabled: true,
      bevelSegments: 4,
      steps: 1,
      bevelSize: 0.12,
      bevelThickness: 0.14
    };
    // Helper: Build mirrored symmetrical 3D shape
    function createMirroredMesh(shapePoints, zOffset = 0) {
      const shape = new THREE.Shape();
      shape.moveTo(shapePoints[0][0], shapePoints[0][1]);
      for (let i = 1; i < shapePoints.length; i++) {
        shape.lineTo(shapePoints[i][0], shapePoints[i][1]);
      }
      shape.closePath();
      const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geom.center();
      const mesh = new THREE.Mesh(geom, currentMaterial);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.z = zOffset;
      return mesh;
    }
    // 1. Spider Torso & Fangs (Center Body)
    const bodyShape = new THREE.Shape();
    bodyShape.moveTo(0, 2.7);
    bodyShape.lineTo(0.35, 2.9);
    bodyShape.lineTo(0.2, 2.2);
    bodyShape.lineTo(0.8, 1.8);
    bodyShape.lineTo(0.85, 1.1);
    bodyShape.lineTo(0.45, 0.7);
    // Abdomen taper
    bodyShape.lineTo(0.9, 0.4);
    bodyShape.lineTo(0.95, -0.2);
    bodyShape.lineTo(0.3, -2.4);
    bodyShape.lineTo(0, -2.25); // concave bottom
    bodyShape.lineTo(-0.3, -2.4);
    bodyShape.lineTo(-0.95, -0.2);
    bodyShape.lineTo(-0.9, 0.4);
    bodyShape.lineTo(-0.45, 0.7);
    bodyShape.lineTo(-0.85, 1.1);
    bodyShape.lineTo(-0.8, 1.8);
    bodyShape.lineTo(-0.2, 2.2);
    bodyShape.lineTo(-0.35, 2.9);
    bodyShape.closePath();
    const bodyGeom = new THREE.ExtrudeGeometry(bodyShape, {
      depth: 0.52,
      bevelEnabled: true,
      bevelSegments: 5,
      bevelSize: 0.16,
      bevelThickness: 0.18
    });
    bodyGeom.center();
    const bodyMesh = new THREE.Mesh(bodyGeom, currentMaterial);
    emblemGroup.add(bodyMesh);
    // 2. Procedural Sharp Spider Legs (Insomniac Stylized Angles)
    // Coords configured to replicate iconic long sharp silhouette
    const legVectorsRight = [
      // Leg 1 (Topmost needle)
      [
        [0.45, 1.6], [0.95, 2.5], [1.3, 2.9], [1.8, 2.1], [1.5, 4.3], [1.0, 5.0], 
        [1.15, 3.4], [0.8, 2.4], [0.35, 1.45]
      ],
      // Leg 2 (Upper angled)
      [
        [0.6, 1.4], [1.4, 2.1], [2.4, 2.8], [3.2, 1.9], [3.6, 3.7], 
        [3.0, 1.6], [2.2, 2.2], [1.2, 1.6], [0.55, 1.15]
      ],
      // Leg 3 (Mid-Downward spreading)
      [
        [0.6, 0.95], [1.4, 1.25], [2.3, 1.45], [3.3, 0.8], [3.7, -0.2], [3.2, -1.8], [3.1, -1.3],
        [3.3, -0.1], [2.9, 0.5], [2.1, 1.0], [1.3, 0.8], [0.5, 0.65]
      ],
      // Leg 4 (Bottom sweeping stiletto)
      [
        [0.4, 0.5], [1.2, 0.8], [1.8, 0.6], [2.4, -0.6], [2.0, -3.2], [1.4, -4.6], [0.65, -5.3],
        [1.3, -4.0], [1.8, -2.6], [2.0, -0.5], [1.5, 0.3], [0.3, 0.2]
      ]
    ];
    function createLeg(pts, mirror = false) {
      const legShape = new THREE.Shape();
      const multX = mirror ? -1 : 1;
      legShape.moveTo(pts[0][0] * multX, pts[0][1]);
      for (let i = 1; i < pts.length; i++) {
        legShape.lineTo(pts[i][0] * multX, pts[i][1]);
      }
      legShape.closePath();
      const geom = new THREE.ExtrudeGeometry(legShape, {
        depth: 0.32,
        bevelEnabled: true,
        bevelSegments: 3,
        bevelSize: 0.08,
        bevelThickness: 0.1
      });
      geom.center();
      const legMesh = new THREE.Mesh(geom, currentMaterial);
      legMesh.castShadow = true;
      legMesh.receiveShadow = true;
      return legMesh;
    }
    const meshes = [bodyMesh];
    legVectorsRight.forEach(pts => {
      // Right side
      const rLeg = createLeg(pts, false);
      emblemGroup.add(rLeg);
      meshes.push(rLeg);
      // Left side (mirrored)
      const lLeg = createLeg(pts, true);
      emblemGroup.add(lLeg);
      meshes.push(lLeg);
    });
    // Slight forward curve for aerodynamic chest contour
    emblemGroup.scale.set(0.9, 0.9, 0.9);
    emblemGroup.position.y = 0.2;
    // --- Ambient Particle Dust (Web fibers / cyber sparks) ---
    const particleCount = 140;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      pPos[i] = (Math.random() - 0.5) * 18;
      pPos[i + 1] = (Math.random() - 0.5) * 18;
      pPos[i + 2] = (Math.random() - 0.5) * 12;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0x38bdf8,
      size: 0.08,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);
    // --- Interaction States & Event Handlers ---
    let isKineticPulseActive = true;
    let pulseTime = 0;
    // Auto rotate toggle
    const toggleSpinBtn = document.getElementById('toggle-spin');
    const spinText = document.getElementById('spin-text');
    toggleSpinBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      spinText.textContent = controls.autoRotate ? 'Auto Rotate' : 'Rotate Paused';
      toggleSpinBtn.classList.toggle('border-primary', controls.autoRotate);
    });
    // Kinetic core pulse toggle
    const togglePulseBtn = document.getElementById('toggle-pulse');
    togglePulseBtn.addEventListener('click', () => {
      isKineticPulseActive = !isKineticPulseActive;
      togglePulseBtn.classList.toggle('bg-sky-500/20', isKineticPulseActive);
      togglePulseBtn.classList.toggle('border-cyanGlow', isKineticPulseActive);
    });
    togglePulseBtn.classList.add('bg-sky-500/20', 'border-cyanGlow');
    // Camera Recenter
    document.getElementById('reset-cam').addEventListener('click', () => {
      camera.position.set(0, 0, 16);
      controls.target.set(0, 0, 0);
      controls.update();
    });
    // Shockwave Impulse Blast
    let shockwaveT = 0;
    let shockwaveActive = false;
    document.getElementById('btn-pulse-wave').addEventListener('click', () => {
      shockwaveActive = true;
      shockwaveT = 0;
      keyLight.intensity = 5.0;
      bottomGlow.intensity = 6.0;
      navigator.vibrate?.([30, 40, 60]); // Mobile tactile feedback if supported
    });
    // Material Switcher Logic
    const finishBtns = document.querySelectorAll('.finish-btn');
    const finishNameLabel = document.getElementById('current-finish-name');
    const finishLabels = {
      white: "Insomniac White",
      stealth: "Stealth Noir",
      chrome: "Titanium Armor",
      crimson: "Velocity Strike"
    };
    finishBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        finishBtns.forEach(b => {
          b.classList.remove('ring-2', 'ring-primary', 'dark:ring-primary', 'border-primary');
          b.classList.add('border-slate-200/60', 'dark:border-slate-800');
        });
        btn.classList.add('ring-2', 'ring-primary', 'border-primary');
        const finish = btn.getAttribute('data-finish');
        currentMaterial = materials[finish];
        meshes.forEach(mesh => {
          mesh.material = currentMaterial;
        });
        finishNameLabel.textContent = finishLabels[finish];
      });
    });
    // Highlight initial active finish
    document.querySelector('[data-finish="white"]').classList.add('ring-2', 'ring-primary');
    // --- RESIZE LISTENER ---
    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();
    let frameCounter = 0;
    let lastFpsUpdate = 0;
    const fpsElem = document.getElementById('fps-counter');
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();
      // FPS Tracker
      frameCounter++;
      if (elapsed - lastFpsUpdate >= 0.5) {
        fpsElem.textContent = `${Math.round(frameCounter / (elapsed - lastFpsUpdate))} FPS`;
        frameCounter = 0;
        lastFpsUpdate = elapsed;
      }
      controls.update();
      // Float breathing motion
      emblemGroup.position.y = Math.sin(elapsed * 1.5) * 0.15;
      // Kinetic Core breathing light
      if (isKineticPulseActive) {
        pulseTime += delta * 2.5;
        const breath = (Math.sin(pulseTime) + 1.0) * 0.5;
        rimLight.intensity = 2.0 + breath * 2.2;
        bottomGlow.intensity = 1.6 + breath * 1.8;
        emblemGroup.rotation.z = Math.sin(elapsed * 0.8) * 0.02;
      }
      // Shockwave burst animation
      if (shockwaveActive) {
        shockwaveT += delta * 4;
        emblemGroup.scale.setScalar(0.9 + Math.sin(shockwaveT * Math.PI) * 0.08);
        if (shockwaveT >= 1) {
          shockwaveActive = false;
          keyLight.intensity = 2.2;
          bottomGlow.intensity = 2.0;
          emblemGroup.scale.setScalar(0.9);
        }
      }
      // Subtle particle float
      particles.rotation.y = elapsed * 0.04;
      particles.rotation.x = Math.sin(elapsed * 0.02) * 0.1;
      renderer.render(scene, camera);
    }
    animate();
  </script>
